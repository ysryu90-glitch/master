name: HealthDashboard
options:
  bundleIdPrefix: com.example
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  HealthDashboard:
    type: application
    platform: iOS
    sources:
      - HealthDashboard
    info:
      path: HealthDashboard/Resources/Info.plist
      properties:
        CFBundleDisplayName: 건강 대시보드
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: 걸음 수, 심박수, 수면, 운동 등 건강 데이터를 한 화면에 보여주기 위해 읽기 권한이 필요합니다.
        NSHealthUpdateUsageDescription: 이 앱은 건강 데이터를 기록하지 않습니다.
    entitlements:
      path: HealthDashboard/Resources/HealthDashboard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthdashboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
