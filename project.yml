name: HealthDashboard
options:
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
# 서명 정보(팀, 번들 ID)는 Configs/Local.xcconfig 에 한 번만 적어 두면 됩니다. (README 참고)
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
# 실행(⌘R)은 앱 스킴으로. 위젯은 앱과 함께 설치된다.
schemes:
  HealthDashboard:
    build:
      targets:
        HealthDashboard: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  HealthDashboard:
    type: application
    platform: iOS
    sources:
      - HealthDashboard
      - Shared
    dependencies:
      - target: HealthWidgets
    info:
      path: HealthDashboard/Resources/Info.plist
      properties:
        CFBundleDisplayName: 건강 대시보드
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: 걸음 수, 심박수, 수면, 운동 등 건강 데이터를 한 화면에 보여주기 위해 읽기 권한이 필요합니다.
        NSHealthUpdateUsageDescription: 이 앱은 건강 데이터를 기록하지 않습니다.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - healthdashboard.refresh
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: HealthDashboard/Resources/HealthDashboard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthdashboard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HealthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HealthWidgets
      - Shared
    info:
      path: HealthWidgets/Info.plist
      properties:
        CFBundleDisplayName: 건강 대시보드
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: HealthWidgets/HealthWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthdashboard.widgets
        SKIP_INSTALL: YES
