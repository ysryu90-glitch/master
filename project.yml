name: HealthDashboard
options:
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
# 서명 정보(팀, 번들 ID)는 Configs/Local.xcconfig 에 한 번만 적어 두면 됩니다. (README 참고)
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
# 실행(⌘R)은 앱 스킴으로. 위젯은 앱과 함께 설치된다.
schemes:
  HealthDashboard:
    build:
      targets:
        HealthDashboard: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  HealthDashboard:
    type: application
    platform: iOS
    sources:
      - HealthDashboard
      - Shared
    dependencies:
      - target: HealthWidgets
    info:
      path: HealthDashboard/Resources/Info.plist
      properties:
        CFBundleDisplayName: 건강 대시보드
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSHealthShareUsageDescription: 걸음 수, 심박수, 수면, 운동 등 건강 데이터를 한 화면에 보여주기 위해 읽기 권한이 필요합니다.
        NSHealthUpdateUsageDescription: 식단 기록(칼로리 · 탄수화물 · 단백질 · 지방 · 당류 · 나트륨)을 건강 앱에 저장하기 위해 사용합니다. 그 밖의 건강 데이터는 쓰지 않습니다.
        NSCameraUsageDescription: 음식 사진과 영양성분표를 찍어 식단을 기록하기 위해 사용합니다. 사진은 기기 안에서만 분석하고 저장합니다.
        NSCalendarsFullAccessUsageDescription: 가족 캘린더의 일정을 보여주고, 앱에서 추가한 일정을 애플 캘린더에 저장하기 위해 사용합니다.
        NSCalendarsUsageDescription: 가족 캘린더의 일정을 보여주고, 앱에서 추가한 일정을 애플 캘린더에 저장하기 위해 사용합니다.
        NSRemindersFullAccessUsageDescription: 배우자와 함께 쓰는 장보기 목록(미리알림)에 재료를 추가하고 체크하기 위해 사용합니다.
        NSRemindersUsageDescription: 배우자와 함께 쓰는 장보기 목록(미리알림)에 재료를 추가하고 체크하기 위해 사용합니다.
        NSSpeechRecognitionUsageDescription: AI 코치에게 말로 질문할 때 음성을 글자로 바꾸기 위해 사용합니다. 가능하면 기기 안에서만 처리합니다.
        NSMicrophoneUsageDescription: AI 코치에게 말로 질문하기 위해 마이크를 사용합니다.
        NSLocationWhenInUseUsageDescription: 지금 있는 곳과 가까운 지역(은평구·소공동·평택)의 날씨를 자동으로 보여주기 위해 사용합니다. 위치는 기기 밖으로 보내지 않습니다.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - healthdashboard.refresh
        AppGroupID: $(APP_GROUP_ID)
        # 가족 전광판: 집 안의 NAS(IP 주소, http)로 요약을 보내기 위해
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 집 안의 NAS(가족 전광판)로 오늘의 일정 · 저녁 계획 · 건강 요약을 보내기 위해 사용합니다.
    entitlements:
      path: HealthDashboard/Resources/HealthDashboard.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthdashboard
        # iOS 27 SDK(Xcode 27 이상)로 빌드할 때만 음식 사진 AI 분석 코드를 켠다.
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": "$(inherited) IOS27_SDK"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": "$(inherited) IOS27_SDK"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  HealthWidgets:
    type: app-extension
    platform: iOS
    # 제어 센터 버튼(ControlWidget)이 iOS 18부터라 위젯만 iOS 18 이상
    deploymentTarget: "18.0"
    sources:
      - HealthWidgets
      - Shared
    info:
      path: HealthWidgets/Info.plist
      properties:
        CFBundleDisplayName: 건강 대시보드
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: HealthWidgets/HealthWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).healthdashboard.widgets
        SKIP_INSTALL: YES
