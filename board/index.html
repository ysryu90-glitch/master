<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가족 전광판">
<meta name="theme-color" content="#0b0f14">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="board.css">
<title>가족 전광판</title>
</head>
<body class="day">
<div id="board">
  <header class="top">
    <div class="date">
      <div id="date" class="date-main">&nbsp;</div>
      <div id="greeting" class="date-sub">&nbsp;</div>
    </div>
    <div id="clock" class="clock">--:--</div>
    <div id="now-weather" class="now-weather"></div>
  </header>

  <div id="advice" class="advice hidden"></div>

  <main class="grid">
    <section class="panel" id="panel-schedule">
      <h2>📅 가족 일정</h2>
      <div id="schedule" class="list"><div class="empty">일정을 불러오는 중…</div></div>
    </section>

    <section class="panel" id="panel-dinner">
      <h2>🍽 저녁</h2>
      <div id="tonight" class="tonight"></div>
      <div id="week-dinners" class="week-dinners"></div>
      <div id="shopping" class="shopping"></div>
    </section>

    <section class="panel" id="panel-weather">
      <h2>🌤 날씨</h2>
      <div id="weather" class="weather"><div class="empty">날씨를 불러오는 중…</div></div>
    </section>
  </main>

  <footer class="bottom">
    <div id="health" class="health"></div>
    <div id="status" class="status"></div>
  </footer>
</div>

<div id="night" class="night hidden">
  <div id="night-clock" class="night-clock">--:--</div>
  <div id="night-sub" class="night-sub"></div>
</div>

<script src="board.js"></script>
</body>
</html>
