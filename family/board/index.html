<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가족 전광판">
<meta name="theme-color" content="#0a0f1c">
<link rel="icon" href="../assets/icon.png">
<link rel="apple-touch-icon" href="../assets/icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="board.css?v=3">
<title>가족 전광판</title>
</head>
<body>
<div id="board">
  <header class="top">
    <div class="clock-block">
      <div id="clock" class="clock">--:--</div>
      <div id="date" class="date">&nbsp;</div>
    </div>
    <div id="now-weather" class="now-weather"></div>
  </header>

  <div id="notice" class="notice hidden"></div>

  <main class="grid">
    <section class="card">
      <div class="card-title"><span class="ic">📅</span>오늘 일정</div>
      <div id="today-events" class="events"></div>
      <div class="card-title sub"><span class="ic">🗓</span>다가오는 일정</div>
      <div id="upcoming" class="upcoming"></div>
    </section>

    <section class="card dinner-card">
      <div class="card-title"><span class="ic">🍽</span>오늘 저녁 <span id="dinner-time" class="title-meta"></span></div>
      <div id="dinner"></div>
      <div class="card-title sub"><span class="ic">🍲</span>이번 주 저녁</div>
      <div id="week" class="week"></div>
    </section>

    <div class="side">
      <section class="card">
        <div class="card-title"><span class="ic">🌤</span>날씨</div>
        <div id="weather"></div>
      </section>
      <section id="memory-card" class="card memory-card hidden">
        <img id="memory-img" alt="">
        <div id="memory-cap" class="memory-cap"></div>
      </section>
      <section class="card shop-card">
        <div class="card-title"><span class="ic">🛒</span>장보기 <span id="shop-count" class="title-meta"></span></div>
        <div id="shopping" class="chips"></div>
      </section>
    </div>
  </main>

  <footer id="people" class="people"></footer>
  <div id="status" class="status"></div>
</div>

<div id="night" class="night hidden">
  <div id="night-clock" class="night-clock">--:--</div>
  <div id="night-sub" class="night-sub"></div>
</div>

<script src="board.js?v=3"></script>
</body>
</html>
